version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cardioguard_db_dev
    environment:
      POSTGRES_DB: cardioguard
      POSTGRES_USER: cardioguard_admin
      POSTGRES_PASSWORD: cardioguard_dev_secret_db_pass
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cardioguard_redis_dev
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cardioguard_backend_dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=cardioguard_admin
      - POSTGRES_PASSWORD=cardioguard_dev_secret_db_pass
      - POSTGRES_DB=cardioguard
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PREDICTION_MODE=demo
      - APP_CHECK_ENABLED=false
      - PYTHONPATH=/app/backend:/app
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    restart: always

  frontend:
    image: node:20-alpine
    container_name: cardioguard_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_APP_CHECK_ENABLED=false
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata_dev:
    driver: local
