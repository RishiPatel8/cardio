version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cardioguard_db
    environment:
      POSTGRES_DB: cardioguard
      POSTGRES_USER: cardioguard_admin
      POSTGRES_PASSWORD: cardioguard_dev_secret_db_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardioguard_admin -d cardioguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cardioguard_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cardioguard_backend
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=cardioguard_admin
      - POSTGRES_PASSWORD=cardioguard_dev_secret_db_pass
      - POSTGRES_DB=cardioguard
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PREDICTION_MODE=real
      - APP_CHECK_ENABLED=false
      - PYTHONPATH=/app/backend:/app
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardioguard_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_APP_CHECK_ENABLED=false
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
